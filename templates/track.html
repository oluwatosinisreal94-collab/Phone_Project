<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    
    <style>

    .track-order{
    padding:60px 20px;
    background:#f1f5f9;
    display:flex;
    justify-content:center;
}


.track-box{

    background:white;
    width:90%;
    max-width:450px;
    padding:35px;
    border-radius:20px;

    box-shadow:0 10px 25px rgba(0,0,0,0.1);

    text-align:center;
}


.track-box h2{

    color:#111827;
    margin-bottom:10px;

}


.track-box p{

    color:#6b7280;
    margin-bottom:25px;

}


.track-box input{

    width:100%;
    padding:14px;

    border:1px solid #ddd;
    border-radius:10px;

    font-size:16px;

}


.track-box button{

    width:100%;
    margin-top:20px;

    padding:14px;

    background:#2563eb;
    color:white;

    border:none;
    border-radius:10px;

    font-size:17px;
    cursor:pointer;

}


.track-box button:hover{

    background:#1d4ed8;

}
</style>

</head>
<body>
    

    <div class="track-order">

    <div class="track-box">

        <h2>Track Your Order</h2>

        <p>
            Enter your order ID to check your order status
        </p>


        <form action="/track" method="POST">

            <input 
                type="phone"
                name="phone_number"
                placeholder="Enter Order PhoneNumber"
                required>


            <button type="submit">
                Track Order
            </button>

        </form>


    </div>

</div>



<div class="product-box">



<p>{{.Customer}}</p>




<p>{{.PhoneNumber}}</p>





<p>Address: {{.Address}}</p>




<p>{{.ProductName}}</p>




<p> {{.ProductPrice}}</p>





<p> {{.Status}}</p>





</body>
</html>
