<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Order Successful - PhoneHub</title>
    <link rel="stylesheet" href="/static/style.css">
    <style>
        body {
            background: #f4f6f9;
            font-family: 'Arial', sans-serif;
            margin: 0;
            padding: 0;
            display: flex;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
        }

        .success-container {
            background: white;
            width: 90%;
            max-width: 450px;
            padding: 40px 30px;
            border-radius: 20px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.1);
            text-align: center;
        }

        .success-icon {
            font-size: 60px;
            color: #22c55e;
            background: #dcfce7;
            width: 100px;
            height: 100px;
            line-height: 100px;
            border-radius: 50%;
            margin: 0 auto 25px auto;
            animation: scaleUp 0.4s ease-out-in;
        }

        h1 {
            color: #111827;
            font-size: 26px;
            margin-bottom: 10px;
        }

        p {
            color: #6b7280;
            font-size: 16px;
            line-height: 1.5;
            margin-bottom: 30px;
        }

        .order-details {
            background: #111827;
            color: white;
            padding: 20px;
            border-radius: 12px;
            text-align: left;
            margin-bottom: 30px;
        }

        .order-details h3 {
            margin: 0 0 10px 0;
            color: #38bdf8;
            font-size: 18px;
        }

        .detail-row {
            display: flex;
            justify-content: space-between;
            margin: 8px 0;
            font-size: 14px;
            border-bottom: 1px solid #1f2937;
            padding-bottom: 8px;
        }

        .detail-row:last-child {
            border-bottom: none;
            padding-bottom: 0;
        }

        .detail-label {
            color: #9ca3af;
        }

        .home-btn {
            display: block;
            background: #2563eb;
            color: white;
            text-decoration: none;
            padding: 14px;
            border-radius: 10px;
            font-size: 16px;
            font-weight: bold;
            transition: background 0.2s;
        }

        .home-btn:hover {
            background: #1d4ed8;
        }

        @keyframes scaleUp {
            0% {
                transform: scale(0);
            }

            80% {
                transform: scale(1.1);
            }

            100% {
                transform: scale(1);
            }
        }
    </style>
</head>

<body>

    <div class="success-container">
        <div class="success-icon">✓</div>

        <h1>Order Placed!</h1>
        <p>Thank you {{.Customer}} for shopping with PhoneHub. We've received your order and our sales team will call
            you shortly to confirm delivery.</p>

        <div class="order-details">
            <h3>Order Summary</h3>

            <div class="detail-row">
                <span class="detail-label">Order ID:</span>
                <span>{{.ID}}</span>
            </div>

            <div class="detail-row">
                <span class="detail-label">Customer:</span>
                <span>{{.Customer}}</span>
            </div>
            <div class="detail-row">
                <span class="detail-label">Phone:</span>
                <span>{{.PhoneNumber}}</span>
            </div>
            <div class="detail-row">
                <span class="detail-label">Address:</span>
                <span>{{.Address}}</span>
            </div>
        </div>

        <a href="/" class="home-btn">Continue Shopping</a>
    </div>

</body>

</html>
