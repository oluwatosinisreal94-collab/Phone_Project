<!DOCTYPE html>
<html>

<head>

<title>PhoneHub Checkout</title>

<link rel="stylesheet" href="/static/style.css">

<style>

body{
    background:#f4f6f9;
    font-family:Arial, sans-serif;
}


.checkout-container{

    width:90%;
    max-width:500px;
    margin:50px auto;
    background:white;
    padding:35px;
    border-radius:20px;

    box-shadow:0 10px 30px rgba(0,0,0,0.15);

}


.logo{

text-align:center;
font-size:30px;
font-weight:bold;
margin-bottom:20px;

}



.product-box{

background:#111827;
color:white;
padding:20px;
border-radius:15px;
text-align:center;
margin-bottom:25px;

}


.product-box h2{

margin-bottom:10px;

}



.price{

color:#38bdf8;
font-size:25px;
font-weight:bold;

}



label{

display:block;
margin-top:15px;
font-weight:bold;

}



input{

width:100%;
padding:13px;
margin-top:8px;
border:1px solid #ddd;
border-radius:8px;
font-size:16px;

}



button{

margin-top:25px;
width:100%;
padding:15px;

background:#2563eb;
color:white;

border:none;

border-radius:10px;

font-size:18px;

cursor:pointer;

}



button:hover{

background:#1d4ed8;

}



</style>


</head>


<body>



<div class="checkout-container">


<div class="logo">

📱 PhoneHub

</div>



<div class="product-box">


<h2>
{{.Name}}
</h2>


<p>
Brand: {{.Brand}}
</p>


<div class="price">

{{.Price}}

</div>



</div>





<form action="/submit" method="POST">



<input 
type="hidden"
name="phone_id"
value="{{.ID}}">



<label>
Full Name
</label>

<input 
type="text"
name="customer"
placeholder="Enter your name"
required>



<label>
Phone Number
</label>

<input
type="text"
name="phone_number"
placeholder="Enter phone number"
required>



<label>
Delivery Address
</label>

<input
type="text"
name="address"
placeholder="Enter address"
required>

<input 
type="hidden"
name="product_name"
value="{{.Name}}">


<input 
type="hidden"
name="product_price"
value="{{.Price}}">

<button>

Place Order

</button>



</form>


</div>



</body>

</html>
