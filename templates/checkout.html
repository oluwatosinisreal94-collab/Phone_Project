<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PhoneHub Checkout</title>

    <link rel="stylesheet" href="/static/style.css">

    <style>
        body {
            background: #f4f6f9;
            font-family: Arial, Helvetica, sans-serif;
        }

        .checkout-container {
            width: 90%;
            max-width: 900px;
            margin: 40px auto;
            background: white;
            border-radius: 15px;
            padding: 30px;
            box-shadow: 0 10px 25px rgba(0, 0, 0, .15);
        }

        h1 {
            text-align: center;
            margin-bottom: 30px;
        }

        .order-box {
            margin-bottom: 30px;
            border: 1px solid #ddd;
            border-radius: 10px;
            padding: 20px;
        }

        .order-item {
            display: flex;
            justify-content: space-between;
            align-items: center;

            border-bottom: 1px solid #eee;
            padding: 15px 0;
        }

        .order-item:last-child {
            border-bottom: none;
        }

        .phone-name {
            font-weight: bold;
            font-size: 18px;
        }

        .price {
            color: #2563eb;
            font-weight: bold;
        }

        .summary {
            margin-top: 20px;
            border-top: 2px solid #ddd;
            padding-top: 20px;
        }

        label {
            display: block;
            margin-top: 15px;
            font-weight: bold;
        }

        input {
            width: 100%;
            padding: 12px;
            border-radius: 8px;
            border: 1px solid #ccc;
            margin-top: 6px;
        }

        button {
            width: 100%;
            margin-top: 25px;
            padding: 15px;
            background: #2563eb;
            color: white;
            border: none;
            border-radius: 10px;
            cursor: pointer;
            font-size: 18px;
        }

        button:hover {
            background: #1d4ed8;
        }
    </style>

</head>

<body>

    <div class="checkout-container">

        <h1>📱 PhoneHub Checkout</h1>

        <div class="order-box">

            <h2>Your Order</h2>

            {{range .CartItems}}

            <div class="order-item">

                <div>

                    <p class="phone-name">
                        {{.Phone.Name}}
                    </p>

                    <p>
                        Brand: {{.Phone.Brand}}
                    </p>

                    <p>
                        Quantity: {{.Quantity}}
                    </p>

                </div>

                <div class="price">

                    {{.Phone.Price}}

                </div>

            </div>

            {{end}}

            <div class="summary">

                <h3>Total Items: {{.ItemCount}}</h3>

                <h2>Total Amount: ₦{{.Total}}</h2>

            </div>

        </div>

        <form action="/submit" method="POST">

            <label>Full Name</label>

            <input type="text" name="customer" required>

            <label>Phone Number</label>

            <input type="text" name="phone_number" required>

            <label>Delivery Address</label>

            <input type="text" name="address" required>

            <button>

                Place Order

            </button>

        </form>

    </div>

</body>

</html>
